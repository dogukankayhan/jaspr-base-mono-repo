name: kit_auth
description: Pure-Dart auth — AuthRepository, AuthManager, AuthBloc, TokenStore contract, use cases.
version: 0.0.1
publish_to: none
resolution: workspace

# PURE DART — must never depend on Flutter or Jaspr. Shared by apps/mobile
# (Flutter) and apps/web (Jaspr). Enforced by scripts/check_pure_packages.sh.
environment:
  sdk: ^3.9.0

dependencies:
  kit_network:
    path: ../kit_network
  kit_core:
    path: ../kit_core
  bloc: ^9.1.0
  equatable: ^2.0.7
  dio: ^5.9.0
  get_it: ^9.2.0

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.0


name: app_shared
description: >-
  Platform-neutral app layer shared by apps/mobile (Flutter) and apps/web (Jaspr):
  endpoints, entities, DTOs, repositories, use cases and blocs/cubits.
version: 0.0.1
publish_to: none
resolution: workspace

# PURE DART — must never depend on Flutter or Jaspr. UI lives in the apps;
# everything below the view layer lives here. Enforced by
# scripts/check_pure_packages.sh.
environment:
  sdk: ^3.9.0

dependencies:
  kit_network:
    path: ../kit_network
  kit_core:
    path: ../kit_core
  kit_auth:
    path: ../kit_auth
  bloc: ^9.1.0
  dio: ^5.9.0
  equatable: ^2.0.7

dev_dependencies:
  build_runner: ^2.9.0
  lints: ^6.0.0
  mockito: ^5.5.1
  test: ^1.25.0

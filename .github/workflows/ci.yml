name: CI — Analyze & Test

on:
  push:
    branches: [main, master, develop]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  quality:
    name: Format, Analyze & Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: stable
          cache: true

      - name: Activate Melos
        run: dart pub global activate melos

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Generate i18n strings
        run: melos run gen:i18n

      - name: Check formatting
        run: melos run format:check

      - name: Check package boundaries (pure Dart / Flutter / Jaspr)
        run: melos run check:pure

      - name: Analyze all packages
        run: melos run analyze

      - name: Run unit tests
        run: melos run test:unit

      - name: Generate combined coverage
        run: chmod +x scripts/coverage.sh && ./scripts/coverage.sh

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false

  web:
    name: Web (Jaspr) build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # The workspace contains Flutter packages, so dependency resolution
      # still needs the Flutter SDK even though apps/web itself is pure Dart.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: stable
          cache: true

      - name: Activate Melos & Jaspr CLI
        run: |
          dart pub global activate melos
          dart pub global activate jaspr_cli 0.23.1

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Build web app
        run: melos run web:build

      - uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: apps/web/build/jaspr

  integration:
    name: Integration Tests (real network — allowed to fail)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.x'
          channel: stable
          cache: true

      - name: Activate Melos
        run: dart pub global activate melos

      - name: Bootstrap workspace
        run: melos bootstrap

      - name: Generate i18n strings
        run: melos run gen:i18n

      - name: Run integration tests
        run: melos run integration

name: flutter_base_kit_web_ssr_demo
description: >-
  Experiment — the web app's home + detail pages rendered on the server (SSR)
  with Jaspr, hydrating into the same shared blocs. apps/web is unchanged.
version: 0.0.1
publish_to: none
resolution: workspace

environment:
  sdk: ^3.10.0

dependencies:
  app_shared:
    path: ../../packages/app_shared
  kit_network:
    path: ../../packages/kit_network
  kit_core:
    path: ../../packages/kit_core
  kit_design_tokens:
    path: ../../packages/kit_design_tokens
  jaspr_kit_core:
    path: ../../packages/jaspr_kit_core
  jaspr_kit_ui:
    path: ../../packages/jaspr_kit_ui
  jaspr_kit_network:
    path: ../../packages/jaspr_kit_network

  # Same pins as apps/web — see CLAUDE.md "Web (Jaspr) → Version pins".
  jaspr: 0.23.1
  jaspr_router: 0.8.2
  get_it: ^9.2.0
  universal_web: ^1.1.0
  # Server-only: robots.txt / sitemap.xml routes next to the Jaspr pages.
  shelf: ^1.4.0
  shelf_router: ^1.1.0

dev_dependencies:
  build_runner: ^2.9.0
  build_web_compilers: ^4.1.0
  jaspr_builder: 0.23.1
  lints: ^6.0.0

jaspr:
  # Pages are rendered on the server per request; only @client components
  # are compiled to JS and "hydrated" (made interactive) in the browser.
  mode: server
